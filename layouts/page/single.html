{{ define "main" }}
<article>
  <header class="page-head">
    <div class="wrap">
      <div class="eyebrow">ZACK.ZIP</div>
      <h1 class="page-head__title">{{ .Title }}</h1>
      {{ with .Description }}<p class="page-head__desc">{{ . }}</p>{{ end }}
    </div>
  </header>
  <div class="wrap log-layout">
    <div class="prose" data-prose>
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
