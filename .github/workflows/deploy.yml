name: Deploy to Github Pages

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            # Give the default GITHUB_TOKEN write permission to commit and push the
            # added or changed files to the repository.
            contents: write

        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Cache Hugo resources
              uses: actions/cache@v5
              with:
                  path: resources
                  key: hugo-resources-${{ hashFiles('go.sum') }}
                  restore-keys: hugo-resources-

            - uses: actions/setup-go@v6
              with:
                  go-version: stable
            - run: go version

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v3
              with:
                  hugo-version: "0.166.0"
                  extended: true

            - name: Build
              run: hugo --minify --gc

            - name: Deploy 🚀
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: gh-pages
                  folder: public
                  clean: true
                  single-commit: true
